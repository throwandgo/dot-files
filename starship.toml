format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
${env_var.git_status_async}\
$python\
$cmd_duration\
$line_break\
$character"""

command_timeout = 1000

[directory]
style = "blue"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[󰰔 ❯](bold white)"
vimcmd_replace_one_symbol = "[󰰠 ❯](bold gray)"
vimcmd_replace_symbol = "[󰰠 ❯](bold gray)"
vimcmd_visual_symbol = "[󰰬 ❯](bold gray)"

[git_branch]
format = " $branch"

[git_status]
untracked = '[ $count]() '
deleted = '[-$count]() '
modified = '[±$count]() '
staged = '[+$count]() '
renamed = '[ $count]() '
ahead = "⇡"
behind = "⇣"
diverged = "󰙁"
format = "[ [($conflicted$untracked$modified$deleted$staged$renamed$ahead_behind)](218) ]($style)"

# git_status is computed in the background by async-git-prompt.zsh (it takes ~400ms in big repos)
# and lands here; the [git_status] section above still configures how it renders.
[env_var.git_status_async]
variable = "STARSHIP_GIT_STATUS"
format = "[$env_value](218)"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "bright-black"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[python]
format = '[${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
symbol = ' '
